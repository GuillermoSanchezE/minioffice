name: Auditoría en Mac

# Evidencias antes de publicar una versión: firma, Gatekeeper, entitlements,
# fusibles, arquitecturas, y una prueba de humo de la app tal cual se distribuye
# en Apple Silicon y en Intel (Rosetta): terminal, ventana, memoria/CPU en
# reposo, cierre limpio y bloqueo del depurador remoto.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Revisar tipos y pruebas unitarias
        run: npm run typecheck && npm test

      - name: Dependencias con vulnerabilidades conocidas
        run: npm audit || true

      - name: Construir (Apple Silicon e Intel)
        run: npm run dist:mac

      - name: Evidencias de firma, Gatekeeper y binarios
        run: bash pruebas/evidencias-mac.sh dist/mac-arm64/minioffice.app dist/mac/minioffice.app 2>&1 | tee evidencias-mac.txt

      - name: Prueba de humo en Apple Silicon (4 min en reposo)
        run: node pruebas/humo-mac.cjs dist/mac-arm64/minioffice.app/Contents/MacOS/minioffice arm64 4 --comprobar-bloqueo

      - name: Prueba de humo en Intel con Rosetta (2 min en reposo)
        continue-on-error: true
        run: node pruebas/humo-mac.cjs dist/mac/minioffice.app/Contents/MacOS/minioffice x64-rosetta 2 --rosetta --espera=300

      - name: Revisión fijada de los modelos de Whisper
        run: |
          for m in onnx-community/whisper-small onnx-community/whisper-base; do
            curl -fsS "https://huggingface.co/api/models/$m/revision/main?blobs=true" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print(d["id"], "sha", d["sha"])
          for f in d.get("siblings", []):
              n = f["rfilename"]
              if n.endswith(".onnx") and "quantized" not in n: continue
              if n.endswith(".onnx_data") or n.startswith("."): continue
              lfs = f.get("lfs") or {}
              print("  ", n, f.get("size"), lfs.get("sha256", ""))
          '
          done 2>&1 | tee modelos.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: auditoria-mac
          path: |
            evidencias-mac.txt
            humo-*.json
            modelos.txt
          retention-days: 30
