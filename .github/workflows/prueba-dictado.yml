name: Prueba del dictado

# Descarga Whisper de verdad y dicta una frase con un micrófono simulado,
# en desarrollo (Whisper base) y en la app empaquetada (Whisper small).
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Compilación de pruebas: la app instalada acepta el depurador remoto (la prueba la maneja así).
      - name: Construir la app (y el .app de Apple Silicon)
        env:
          MAIN_VITE_PRUEBAS: '1'
        run: npm run build && npx electron-builder --mac dir --arm64 --publish never

      - name: Grabar una frase en español con la voz del sistema
        run: |
          VOZ=$(say -v '?' | grep -E 'M[oó]nica|Paulina|Jorge|Juan' | grep -E 'es_(ES|MX)' | head -1 | sed -E 's/[[:space:]]+es_(ES|MX).*//')
          [ -z "$VOZ" ] && VOZ=$(say -v '?' | grep -E 'es_(ES|MX)' | head -1 | sed -E 's/[[:space:]]+es_(ES|MX).*//')
          echo "Voz: ${VOZ:-predeterminada}"
          say ${VOZ:+-v "$VOZ"} -o frase.aiff "Hola Michael. Revisa el formulario de contacto de la página web y corrige los errores."
          afconvert -f WAVE -d LEI16@16000 -c 1 frase.aiff frase.wav
          DUR=$(afinfo frase.wav | awk '/estimated duration/ {print $3}')
          echo "Duración: $DUR s"
          echo "SEGUNDOS=$(python3 -c "print(round(float('$DUR') + 0.8, 1))")" >> "$GITHUB_ENV"

      - name: Dictar en desarrollo (Whisper base)
        run: node pruebas/dictado.cjs frase.wav "$SEGUNDOS" base "" capturas-dictado

      - name: Dictar en la app empaquetada (Whisper small)
        run: node pruebas/dictado.cjs frase.wav "$SEGUNDOS" small dist/mac-arm64/minioffice.app/Contents/MacOS/minioffice capturas-dictado

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: capturas-dictado
          path: |
            capturas-dictado
            frase.wav
          retention-days: 14
